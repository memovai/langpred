name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -e ./server -e ./sdk-python
          pip install pytest httpx scikit-learn 'uvicorn[standard]'
          # The real Langfuse SDK — used by tests/test_real_langfuse_integration.py
          # to verify drop-in compatibility against the actual upstream SDK.
          pip install 'langfuse<3'
      - name: Test
        run: pytest -q tests/
      - name: Bench (smoke)
        run: python benchmarks/eval_predictions.py
