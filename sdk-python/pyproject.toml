[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langpred"
version = "0.1.0"
description = "Langpred SDK — ETA/cost/budget prediction for LLM agent trajectories. Drop-in for the Langfuse SDK."
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Langpred contributors"}]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["langpred*"]
